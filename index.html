<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>사망 아티스트 목록</title>
<style>
:root{--green:#1db954;--ink:#17231b;--muted:#66736a;--line:#dfe7e0;--bg:#f4f7f4;--red:#b42318;--amber:#946200}
*{box-sizing:border-box}html,body{height:100%;min-height:100%;margin:0;overscroll-behavior-y:contain}body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
header{flex:0 0 auto;background:#102d1b;color:white;padding:12px 16px}header>div,main{max-width:980px;margin-left:auto;margin-right:auto;width:100%}h1{font-size:clamp(21px,4vw,28px);margin:0}header p{display:none}
main{flex:1;min-height:0;padding:10px;display:flex;flex-direction:column;gap:8px;overflow:hidden}.searchbar{display:flex;gap:7px;align-items:center;flex:0 0 auto}.inputwrap{position:relative;flex:1;min-width:0}.inputwrap input{padding-right:42px}input{font:inherit;width:100%;min-width:0;border:1px solid #cbd7cd;border-radius:9px;padding:9px 10px;background:white;color:inherit;min-height:42px;font-size:16px}.clearbtn{position:absolute;right:3px;top:3px;width:36px;height:36px;min-height:36px;padding:0;border-radius:7px;background:transparent;color:#536158;font-size:22px;line-height:1}.clearbtn:active{background:#e8eee9}
button{font:inherit;font-size:14px;font-weight:700;border:0;border-radius:9px;padding:9px 12px;min-height:42px;background:var(--green);color:#082411;cursor:pointer;white-space:nowrap;line-height:1.25}button.secondary{background:#e8eee9;color:#24372a}button:disabled{opacity:.5;cursor:wait}#searchBtn{flex:0 0 auto}
#statusMsg{flex:0 0 auto;font-size:12px;color:var(--muted);min-height:0}
.sortbar{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex:0 0 auto}
.sortbar label{font-size:12px;color:var(--muted);white-space:nowrap}
select{font:inherit;font-size:14px;max-width:100%;border:1px solid #cbd7cd;border-radius:9px;padding:8px 30px 8px 10px;background:white;color:inherit;min-height:40px}
#deadList{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;display:block;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
.artist-list{display:flex;flex-direction:column;gap:8px;padding-bottom:12px}
.artist-card{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--line);border-radius:12px;background:white;min-width:0}
.artist-photo{width:64px;height:64px;flex:0 0 64px;object-fit:cover;border-radius:9px;background:#e8eee9}
.artist-photo.placeholder{display:flex;align-items:center;justify-content:center;color:#718075;font-size:25px}
.artist-info{flex:1;min-width:0}
.artist-name{font-weight:800;overflow-wrap:anywhere}
.artist-name a{color:inherit;text-decoration:none}
.artist-name a:active{text-decoration:underline}
.artist-years{font-size:13px;color:var(--muted);margin-top:3px}
.artist-actions{display:flex;flex-direction:column;gap:5px;flex:0 0 auto}
.artist-actions a{font-size:12px;text-decoration:none;text-align:center}
.artist-actions button{min-height:34px;padding:6px 9px}
.dead{color:var(--red);font-weight:800}.alive{color:#147442;font-weight:800}.unknown{color:var(--amber);font-weight:800}
a{color:#126d39;overflow-wrap:anywhere}.empty{text-align:center;padding:24px;color:var(--muted)}.hint{font-size:12px;color:var(--muted)}
#candidates{flex:0 0 auto;max-height:36%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;border:1px solid var(--line);border-radius:10px;background:white;padding:8px;-webkit-overflow-scrolling:touch}
#candidates .candidate{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin:4px 0;background:#f3f7f3;color:var(--ink);white-space:normal}
#candidates img{width:48px;height:48px;object-fit:cover;border-radius:8px;flex:none}
#candidates .candidate small{display:block;color:var(--muted);font-weight:400}
@media(max-width:560px){header{padding:10px 12px}main{padding:8px;gap:7px}button{font-size:13px;padding:8px 10px;min-height:40px}input{min-height:40px}}
</style>
</head>
<body>
<header><div><h1>🪦 사망 아티스트 목록</h1></div></header>
<main>
  <div class="searchbar">
    <div class="inputwrap"><input id="artistInput" type="text" aria-label="아티스트 이름" placeholder="아티스트 이름 검색" autocomplete="off" enterkeyhint="search"><button type="button" id="clearBtn" class="clearbtn" aria-label="검색 내용 모두 지우기" title="검색 내용 모두 지우기">×</button></div>
    <button id="searchBtn">🔎 검색</button>
  </div>
  <div id="statusMsg" role="status" aria-live="polite">아티스트 이름을 입력하고 검색 버튼을 누르세요.</div>
  <div class="sortbar"><label for="sortSelect">정렬</label><select id="sortSelect"><option value="name-asc">이름순 (가나다/ABC)</option><option value="name-desc">이름순 (역순)</option><option value="death-desc">사망연도 최신순</option><option value="death-asc">사망연도 오래된순</option><option value="birth-asc">출생연도 빠른순</option><option value="birth-desc">출생연도 늦은순</option><option value="added-desc">최근 추가순</option></select></div>
  <div id="deadList"></div>
  <div id="candidates" hidden></div>
</main>
<script>
// 키보드가 열릴 때 모바일 브라우저의 뷰포트 높이 변경에 맞춰 화면 전체가 재배치되지 않도록
// 최초 화면 높이를 고정합니다. 기기 회전 때만 새 높이를 반영합니다.
(function lockAppViewport(){
  const setAppHeight=()=>document.documentElement.style.setProperty('--app-height', window.innerHeight+'px');
  setAppHeight();
  window.addEventListener('orientationchange',()=>setTimeout(setAppHeight,250),{passive:true});
})();
const $=id=>document.getElementById(id);
let deadArtists=[], checkedNames=new Set(), currentCandidates=[], searchBusy=false;
const STORAGE_KEY='deceasedArtistsApp.v1';
function saveState(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      deadArtists, checkedNames:[...checkedNames]
    }));
    $('statusMsg').dataset.saved='true';
  } catch(e) {
    $('statusMsg').dataset.saved='false';
  }
}
function loadState(){
  try {
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw)return;
    const s=JSON.parse(raw);
    if(Array.isArray(s.deadArtists))deadArtists=s.deadArtists;
    if(Array.isArray(s.checkedNames))checkedNames=new Set(s.checkedNames);
  } catch(e) { /* ignore damaged saved data */ }
}
const norm=s=>String(s||'').normalize('NFKC').trim().replace(/\s+/g,' ').toLocaleLowerCase();
function spotifySearchUrl(name){return 'https://open.spotify.com/search/'+encodeURIComponent(name)}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function say(msg,kind=''){ $('statusMsg').innerHTML=kind?`<span class="${kind}">${esc(msg)}</span>`:esc(msg);}
function renderList(){
 const sort=$('sortSelect')?.value||'name-asc';
 let items=[...deadArtists];
 const byName=(a,b)=>String(a.name||'').localeCompare(String(b.name||''),undefined,{sensitivity:'base'});
 const byYear=(a,b,key)=>((a[key]??(key==='year'?-Infinity:Infinity))-(b[key]??(key==='year'?-Infinity:Infinity)));
 if(sort==='name-asc')items.sort(byName);
 else if(sort==='name-desc')items.sort((a,b)=>byName(b,a));
 else if(sort==='death-desc')items.sort((a,b)=>byYear(b,a,'year'));
 else if(sort==='death-asc')items.sort((a,b)=>byYear(a,b,'year'));
 else if(sort==='birth-asc')items.sort((a,b)=>byYear(a,b,'birthYear'));
 else if(sort==='birth-desc')items.sort((a,b)=>byYear(b,a,'birthYear'));
 else if(sort==='added-desc')items.sort((a,b)=>(b.added||0)-(a.added||0));
 if(!items.length){$('deadList').innerHTML='<div class="empty">아직 등록된 사망 아티스트가 없어요.</div>';return}
 $('deadList').innerHTML='<div class="artist-list">'+items.map((x,i)=>`<article class="artist-card" id="artist-${x.id}">${x.spotifyImage?`<img class="artist-photo" src="${esc(x.spotifyImage)}" alt="${esc(x.name)} 아티스트 이미지" loading="lazy">`:'<div class="artist-photo placeholder" aria-hidden="true">♪</div>'}<div class="artist-info"><div class="artist-name">${esc(x.name)}</div><div class="artist-years">${x.birthYear||'출생연도 미확인'} – ${x.year||'사망연도 미확인'}</div></div><div class="artist-actions"><button class="secondary" onclick="removeArtist('${x.id}')">삭제</button></div></article>`).join('')+'</div>';
}
function jumpTo(id){const row=document.getElementById('artist-'+id);if(row){row.scrollIntoView({behavior:'smooth',block:'center'});row.style.background='#e7f8ec';setTimeout(()=>row.style.background='',1800)}}
window.removeArtist=id=>{deadArtists=deadArtists.filter(x=>x.id!==id);renderList();saveState()};

async function checkDeathOnline(name){
 const response=await fetch('/.netlify/functions/death-check?name='+encodeURIComponent(name));
 let data={};
 try { data=await response.json(); } catch (_) {}
 if(!response.ok) {
   if(response.status===404) throw Error('사망정보 확인 서버(/.netlify/functions/death-check)를 찾을 수 없습니다. Netlify에 서버 함수가 배포되어 있는지 확인하세요.');
   throw Error(data.error||`사망정보 서버 오류 (HTTP ${response.status})`);
 }
 return data.matches||[];
}

// 검색 버튼이 호출하던 searchArtist()가 원본 파일에 정의되어 있지 않아
// 클릭 시 ReferenceError가 발생했습니다. 공개 iTunes 검색 API로 아티스트를 찾고
// 기존 사망정보 확인 함수에 연결합니다.
async function searchArtist(rawName){
 const name=String(rawName||'').trim();
 if(!name){say('검색할 아티스트 이름을 입력하세요.','unknown');$('artistInput').focus();return;}
 if(searchBusy)return;
 searchBusy=true;
 $('searchBtn').disabled=true;
 $('candidates').hidden=true;
 $('candidates').innerHTML='';
 say(`“${name}” 아티스트를 검색 중입니다…`);
 try{
   const url='https://itunes.apple.com/search?term='+encodeURIComponent(name)+'&entity=musicArtist&limit=10';
   const response=await fetch(url);
   if(!response.ok)throw Error(`아티스트 검색 서버 오류 (HTTP ${response.status})`);
   const data=await response.json();
   const results=Array.isArray(data.results)?data.results:[];
   if(!results.length){
     say(`“${name}” 검색 결과가 없습니다. 이름의 철자나 영문 표기를 확인해 주세요.`,'unknown');
     return;
   }
   const query=norm(name);
   results.sort((a,b)=>(norm(a.artistName)===query?-1:0)-(norm(b.artistName)===query?-1:0));
   const artist=results[0];
   await selectSpotifyArtist({
     id:String(artist.artistId),
     name:artist.artistName||name,
     url:artist.artistLinkUrl||spotifySearchUrl(artist.artistName||name),
     image:'',
   });
 }catch(e){
   say(`검색에 실패했습니다: ${e.message||'알 수 없는 오류'}. 인터넷 연결과 서버 배포 상태를 확인하세요.`,'unknown');
 }finally{
   searchBusy=false;
   $('searchBtn').disabled=false;
 }
}
async function selectSpotifyArtist(artist){
 say(`“${artist.name}”의 사망 여부를 Wikidata와 Wikipedia 자료로 교차 확인 중…`);
 try{
  const matches=await checkDeathOnline(artist.name);
  if(!matches.length){say(`“${artist.name}”은 Spotify에서 확인했지만, Wikidata의 사망 기록과 Wikipedia의 사망 관련 설명이 함께 확인되지 않았습니다. 잘못된 인물을 등록하지 않았습니다.`,'unknown');return;}
  const unique=matches.filter((x,i,a)=>a.findIndex(y=>y.qid===x.qid)===i);
  if(unique.length>1){
    currentCandidates=unique;
    $('candidates').innerHTML='<strong>동명이인 또는 관련 인물이 여러 명 확인되었습니다. 설명을 확인해 선택하세요.</strong>'+unique.map((x,i)=>`<button class="candidate" type="button" data-index="${i}"><span><b>${esc(x.label)}</b><small>${esc(x.description||'설명 없음')} · 사망 ${x.deathYear}년</small></span></button>`).join('');
    $('candidates').hidden=false;
    $('candidates').querySelectorAll('button[data-index]').forEach(btn=>btn.onclick=()=>addVerifiedArtist(unique[Number(btn.dataset.index)],artist));
    say('두 외부 자료에서 사망 정보가 확인된 후보입니다. 정확한 인물을 선택하세요.','unknown');return;
  }
  addVerifiedArtist(unique[0],artist);
 }catch(e){say(`사망 정보 확인 실패: ${e.message}`,'unknown')}
}
function addVerifiedArtist(person,spotifyArtist){
 if(deadArtists.some(a=>a.qid===person.qid||a.spotifyId===spotifyArtist.id)){
  say(`“${spotifyArtist.name}”은 이미 목록에 등록되어 있습니다.`,'unknown');$('candidates').hidden=true;return;
 }
 deadArtists.push({id:'d'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),qid:person.qid,spotifyId:spotifyArtist.id,spotifyUrl:spotifyArtist.url,spotifyImage:spotifyArtist.image||'',name:spotifyArtist.name,birthYear:person.birthYear,year:person.deathYear,added:Date.now(),deathDate:person.deathDate});
 $('candidates').hidden=true;$('candidates').innerHTML='';renderList();saveState();say(`“${spotifyArtist.name}”의 사망 정보가 Wikidata와 Wikipedia에서 교차 확인되어 등록되었습니다.`,'dead');
}
$('sortSelect').onchange=renderList;
$('searchBtn').onclick=()=>searchArtist($('artistInput').value);
$('artistInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();searchArtist($('artistInput').value)}});
$('clearBtn').onclick=()=>{$('artistInput').value='';$('artistInput').focus();say('검색 내용을 지웠습니다.');};
loadState();
renderList();
saveState();
window.addEventListener('pagehide',saveState);
</script>
</body></html>
