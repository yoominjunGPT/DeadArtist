<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>사망 아티스트 목록</title>
<style>
:root{--green:#1db954;--ink:#17231b;--muted:#66736a;--line:#dfe7e0;--bg:#f4f7f4;--red:#b42318;--amber:#946200}
*{box-sizing:border-box}html,body{height:100%;margin:0;overscroll-behavior:none}body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5;display:flex;flex-direction:column;height:var(--app-height,100vh);overflow:hidden}
header{flex:0 0 auto;background:#102d1b;color:white;padding:12px 16px}header>div,main{max-width:980px;margin-left:auto;margin-right:auto;width:100%}h1{font-size:clamp(21px,4vw,28px);margin:0}header p{display:none}
main{flex:1;min-height:0;padding:10px;display:flex;flex-direction:column;gap:8px;overflow:hidden}.searchbar{display:flex;gap:7px;align-items:center;flex:0 0 auto}.inputwrap{position:relative;flex:1;min-width:0}.inputwrap input{padding-right:42px}input{font:inherit;width:100%;min-width:0;border:1px solid #cbd7cd;border-radius:9px;padding:9px 10px;background:white;color:inherit;min-height:42px;font-size:16px}.clearbtn{position:absolute;right:3px;top:3px;width:36px;height:36px;min-height:36px;padding:0;border-radius:7px;background:transparent;color:#536158;font-size:22px;line-height:1}.clearbtn:active{background:#e8eee9}
button{font:inherit;font-size:14px;font-weight:700;border:0;border-radius:9px;padding:9px 12px;min-height:42px;background:var(--green);color:#082411;cursor:pointer;white-space:nowrap;line-height:1.25}button.secondary{background:#e8eee9;color:#24372a}button:disabled{opacity:.5;cursor:wait}#searchBtn{flex:0 0 auto}
#statusMsg{flex:0 0 auto;font-size:12px;color:var(--muted);min-height:0}#deadList{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}.tablewrap{overflow-x:auto;overflow-y:auto;overscroll-behavior:contain;max-height:none;height:100%;min-height:0;border:1px solid var(--line);border-radius:10px;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}table{border-collapse:collapse;width:100%;min-width:570px;font-size:14px}th,td{text-align:left;padding:10px;border-bottom:1px solid #e8eee9;vertical-align:top}th{position:sticky;top:0;background:#eef5ef;z-index:1}tr:last-child td{border-bottom:0}.dead{color:var(--red);font-weight:800}.alive{color:#147442;font-weight:800}.unknown{color:var(--amber);font-weight:800}a{color:#126d39;overflow-wrap:anywhere}.empty{text-align:center;padding:24px;color:var(--muted)}.hint{font-size:12px;color:var(--muted)}#candidates{flex:0 0 auto;max-height:34%;overflow:auto;border:1px solid var(--line);border-radius:10px;background:white;padding:8px}#candidates .candidate{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin:4px 0;background:#f3f7f3;color:var(--ink);white-space:normal}#candidates img{width:42px;height:42px;object-fit:cover;border-radius:50%;flex:none}#candidates .candidate small{display:block;color:var(--muted);font-weight:400}
@media(max-width:560px){header{padding:10px 12px}main{padding:8px;gap:7px}button{font-size:13px;padding:8px 10px;min-height:40px}input{min-height:40px}}
</style>
</head>
<body>
<header><div><h1>🎵 사망 아티스트 목록</h1></div></header>
<main>
  <div class="searchbar">
    <div class="inputwrap"><input id="artistInput" type="text" placeholder="아티스트 이름 검색" autocomplete="off" enterkeyhint="search"><button type="button" id="clearBtn" class="clearbtn" aria-label="검색 내용 모두 지우기" title="검색 내용 모두 지우기">×</button></div>
    <button id="searchBtn">🔎 검색</button>
  </div>
  <div id="statusMsg" aria-live="polite">Spotify에서 아티스트를 검색한 뒤 선택하면 사망 정보를 확인합니다.</div>
  <div id="deadList"></div>
  <div id="candidates" hidden></div>
</main>
<script>
// 키보드가 열릴 때 모바일 브라우저의 뷰포트 높이 변경에 맞춰 화면 전체가 재배치되지 않도록
// 최초 화면 높이를 고정합니다. 기기 회전 때만 새 높이를 반영합니다.
(function lockAppViewport(){
  const setAppHeight=()=>document.documentElement.style.setProperty('--app-height', window.innerHeight+'px');
  setAppHeight();
  window.addEventListener('orientationchange',()=>setTimeout(setAppHeight,250),{passive:true});
})();
const $=id=>document.getElementById(id);
let deadArtists=[], checkedNames=new Set(), currentCandidates=[], searchBusy=false;
const STORAGE_KEY='deceasedArtistsApp.v1';
function saveState(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      deadArtists, checkedNames:[...checkedNames]
    }));
    $('statusMsg').dataset.saved='true';
  } catch(e) {
    $('statusMsg').dataset.saved='false';
  }
}
function loadState(){
  try {
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw)return;
    const s=JSON.parse(raw);
    if(Array.isArray(s.deadArtists))deadArtists=s.deadArtists;
    if(Array.isArray(s.checkedNames))checkedNames=new Set(s.checkedNames);
  } catch(e) { /* ignore damaged saved data */ }
}
const norm=s=>String(s||'').normalize('NFKC').trim().replace(/\s+/g,' ').toLocaleLowerCase();
function spotifySearchUrl(name){return 'https://open.spotify.com/search/'+encodeURIComponent(name)}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function say(msg,kind=''){ $('statusMsg').innerHTML=kind?`<span class="${kind}">${esc(msg)}</span>`:esc(msg);}
function renderList(){
 let items=[...deadArtists].sort((a,b)=>a.name.localeCompare(b.name,undefined,{sensitivity:'base'}));
 if(!items.length){$('deadList').innerHTML='<div class="empty">아직 등록된 사망 아티스트가 없어요.</div>';return}
 $('deadList').innerHTML='<div class="tablewrap" id="tablewrap"><table><thead><tr><th>#</th><th>아티스트</th><th>활동 기간</th><th>자료 출처</th><th>관리</th></tr></thead><tbody>'+items.map((x,i)=>`<tr id="artist-${x.id}"><td>${i+1}</td><td><strong><a href="${esc(x.spotifyUrl||spotifySearchUrl(x.name))}" target="_blank" rel="noopener">${esc(x.name)}</a></strong>${x.stageName?`<br><span class="hint">활동명: ${esc(x.stageName)}</span>`:''}${x.description?`<br><span class="hint">${esc(x.description)}</span>`:''}</td><td>${x.birthYear||'출생연도 미확인'} – ${x.year||'사망연도 미확인'}</td><td><a href="${esc(x.url)}" target="_blank" rel="noopener">Wikidata ↗</a>${x.wiki?`<br><a href="${esc(x.wiki)}" target="_blank" rel="noopener">Wikipedia ↗</a>`:''}</td><td><button class="secondary" onclick="removeArtist('${x.id}')">삭제</button></td></tr>`).join('')+'</tbody></table></div>';
 setupAxisLockedScroll($('tablewrap'));
}
function setupAxisLockedScroll(el){
 if(!el || el.dataset.axisLock==='1')return;el.dataset.axisLock='1';let sx=0,sy=0,sl=0,st=0,axis=null;
 el.addEventListener('touchstart',e=>{if(!e.touches[0])return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;sl=el.scrollLeft;st=el.scrollTop;axis=null},{passive:true});
 el.addEventListener('touchmove',e=>{if(!e.touches[0])return;const dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;if(!axis&&Math.max(Math.abs(dx),Math.abs(dy))>7)axis=Math.abs(dx)>Math.abs(dy)?'x':'y';if(!axis)return;e.preventDefault();if(axis==='x')el.scrollLeft=sl-dx;else el.scrollTop=st-dy},{passive:false});
}
function jumpTo(id){const row=document.getElementById('artist-'+id);if(row){row.scrollIntoView({behavior:'smooth',block:'center'});row.style.background='#e7f8ec';setTimeout(()=>row.style.background='',1800)}}
window.removeArtist=id=>{deadArtists=deadArtists.filter(x=>x.id!==id);renderList();saveState()};

async function wikidataSearch(name){
 const url='https://www.wikidata.org/w/api.php?action=wbsearchentities&search='+encodeURIComponent(name)+'&language=en&uselang=en&type=item&limit=8&format=json&origin=*';
 const r=await fetch(url);if(!r.ok)throw Error('Wikidata 검색 요청 실패');const d=await r.json();return (d.search||[]).filter(x=>x.id);
}
async function getEntity(id){
 const u='https://www.wikidata.org/wiki/Special:EntityData/'+encodeURIComponent(id)+'.json';
 const r=await fetch(u);if(!r.ok)throw Error('아티스트 자료를 읽지 못했습니다');const d=await r.json();return d.entities[id];
}
function claimValue(entity,prop){const c=entity?.claims?.[prop]?.[0]?.mainsnak?.datavalue?.value;return c}
function yearFromDate(v){if(!v||!v.time)return null;const m=v.time.match(/[+-](\d{4,})-/);return m?Number(m[1]):null}
function descriptionOf(e){return e?.descriptions?.en?.value||e?.descriptions?.ko?.value||''}
function stageNameOf(e){
  const values=e?.claims?.P742||[];
  const v=values.map(c=>c?.mainsnak?.datavalue?.value).find(x=>typeof x==='string'&&x.trim());
  return v||'';
}
async function searchArtist(name){
 if(searchBusy)return;name=String(name||'').trim();if(!name){say('먼저 아티스트 이름을 입력하세요.','unknown');return}
 searchBusy=true;$('searchBtn').disabled=true;$('candidates').hidden=true;$('candidates').innerHTML='';say(`Spotify에서 “${name}” 검색 중…`);
 try{
  const response=await fetch('/.netlify/functions/spotify-search?q='+encodeURIComponent(name));
  const data=await response.json();
  if(!response.ok)throw Error(data.error||'Spotify 검색 요청에 실패했습니다.');
  const artists=data.artists||[];
  if(!artists.length){say(`Spotify에서 “${name}” 아티스트를 찾지 못했습니다.`,'unknown');return}
  $('candidates').innerHTML='<strong>Spotify 검색 결과 — 정확한 아티스트를 선택하세요.</strong>'+artists.map((a,i)=>`<button class="candidate" type="button" data-index="${i}">${a.image?`<img src="${esc(a.image)}" alt="">`:''}<span><b>${esc(a.name)}</b><small>${esc((a.genres||[]).slice(0,3).join(', ')||'Spotify 아티스트')} · 팔로워 ${(a.followers||0).toLocaleString()}</small></span></button>`).join('');
  $('candidates').hidden=false;
  $('candidates').querySelectorAll('button[data-index]').forEach(btn=>btn.onclick=()=>selectSpotifyArtist(artists[Number(btn.dataset.index)]));
  say(`Spotify 검색 결과 ${artists.length}명을 찾았습니다. 목록에서 해당 아티스트를 선택하세요.`);
 }catch(e){say(`검색 실패: ${e.message}`,'unknown')}
 finally{searchBusy=false;$('searchBtn').disabled=false;$('artistInput').value='';}
}
async function selectSpotifyArtist(artist){
 if(searchBusy)return;searchBusy=true;$('searchBtn').disabled=true;say(`Spotify의 “${artist.name}”와 일치하는 인물의 사망 정보를 확인 중…`);
 try{
  const found=await wikidataSearch(artist.name);
  const entities=await Promise.all(found.slice(0,8).map(async item=>{try{return {item,entity:await getEntity(item.id)}}catch(e){return null}}));
  const exact=entities.filter(x=>x?.entity && norm(x.entity.labels?.en?.value||x.entity.labels?.ko?.value||x.item.label)===norm(artist.name));
  const deceased=exact.filter(x=>claimValue(x.entity,'P570'));
  if(!deceased.length){say(`Spotify 아티스트 “${artist.name}”와 이름이 정확히 일치하는 사망 정보가 확인되지 않았습니다. 잘못된 인물을 자동 등록하지 않았습니다.`,'unknown');return}
  if(deceased.length>1){
    $('candidates').innerHTML='<strong>이름이 같은 인물이 여러 명입니다. 해당 인물을 선택하세요.</strong>'+deceased.map((x,i)=>`<button class="candidate" type="button" data-index="${i}"><span><b>${esc(x.entity.descriptions?.en?.value||x.entity.descriptions?.ko?.value||x.item.description||'설명 없음')}</b><small>${esc(x.item.id)}</small></span></button>`).join('');
    $('candidates').hidden=false;
    $('candidates').querySelectorAll('button[data-index]').forEach(btn=>btn.onclick=()=>addDeceasedArtist(deceased[Number(btn.dataset.index)],artist));
    say('동명이인 후보가 여러 명입니다. 설명을 확인해 선택하세요.','unknown');return;
  }
  addDeceasedArtist(deceased[0],artist);
 }catch(e){say(`사망 정보 확인 실패: ${e.message}`,'unknown')}
 finally{searchBusy=false;$('searchBtn').disabled=false;}
}
function addDeceasedArtist(x,spotifyArtist){
 const e=x.entity, death=claimValue(e,'P570'), birth=claimValue(e,'P569');
 const label=e.labels?.en?.value||e.labels?.ko?.value||x.item.label;
 if(deadArtists.some(a=>a.qid===x.item.id||a.spotifyId===spotifyArtist.id)){
  say(`“${spotifyArtist.name}”은 이미 목록에 등록되어 있습니다.`,'unknown');$('candidates').hidden=true;return;
 }
 deadArtists.push({id:'d'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),qid:x.item.id,spotifyId:spotifyArtist.id,spotifyUrl:spotifyArtist.url,name:spotifyArtist.name,stageName:stageNameOf(e),birthYear:yearFromDate(birth),year:yearFromDate(death),description:descriptionOf(e),url:'https://www.wikidata.org/wiki/'+x.item.id,wiki:e.sitelinks?.enwiki?.url||'',added:Date.now(),deathDate:death.time||''});
 $('candidates').hidden=true;$('candidates').innerHTML='';renderList();saveState();say(`“${spotifyArtist.name}”의 사망 정보가 확인되어 목록에 등록되었습니다.`,'dead');
}
$('searchBtn').onclick=()=>searchArtist($('artistInput').value);
$('artistInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();searchArtist($('artistInput').value)}});
$('clearBtn').onclick=()=>{$('artistInput').value='';$('artistInput').focus();say('검색 내용을 지웠습니다.');};
loadState();
renderList();
saveState();
window.addEventListener('pagehide',saveState);
</script>
</body></html>
